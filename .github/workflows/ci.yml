name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - run: zig fmt --check build.zig build.zig.zon src tests bench tools/interop/export.zig
      - run: zig build
      - run: zig build test
      - run: zig build test -Doptimize=ReleaseSafe
      - run: zig build test -Doptimize=ReleaseFast
      - run: zig build bench-build
      - run: python3 tools/interop/check.py
